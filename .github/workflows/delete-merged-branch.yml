name: Delete Merged Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete head branch
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Delete merged head branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const protectedBranches = [
              'main',
              'dev',
              'stage',
              'research',
              'changelog',
              'portfolio',
            ]

            if (protectedBranches.includes(branch)) {
              core.info(`Skipping protected branch: ${branch}`)
              return
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              })
              core.info(`Deleted branch: ${branch}`)
            } catch (error) {
              // 422 = already gone (e.g. GitHub "Automatically delete head branches")
              if (error.status === 422) {
                core.info(`Branch already deleted: ${branch}`)
                return
              }
              throw error
            }
