name: Auto-close empty milestones

# When the last open issue in a milestone closes (usually on stage merge via
# project-board-sync), close the milestone. Reversible if closed by mistake.
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  close-milestone:
    if: github.event.issue.milestone != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close milestone when no open issues remain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE_NUMBER: ${{ github.event.issue.milestone.number }}
        run: |
          set -euo pipefail
          open=$(gh api "repos/$REPO/milestones/$MILESTONE_NUMBER" --jq .open_issues)
          if [ "$open" -eq 0 ]; then
            gh api -X PATCH "repos/$REPO/milestones/$MILESTONE_NUMBER" -f state=closed >/dev/null
            echo "Closed milestone #$MILESTONE_NUMBER (0 open issues)."
          else
            echo "Milestone #$MILESTONE_NUMBER still has $open open issue(s)."
          fi
