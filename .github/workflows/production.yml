name: Continuous Deployment (Production)

on:
  push:
    branches:
      - main
    paths:
      - "dev/memli/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two production deploys overlap; queue instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # a deploy must never run unverified code.
  validate:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  deploy-to-production:
    needs: validate
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Force the runner container to execute commands directly inside the monorepo subfolder
    defaults:
      run:
        working-directory: dev/memli

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Bun Toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # Pinning to the exact local execution version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile and Deploy Application
        run: bun run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
