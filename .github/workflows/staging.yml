name: Continuous Deployment (Staging)

on:
  push:
    branches:
      - stage
    paths:
      - "dev/memli/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two staging deploys overlap; queue instead of cancelling.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # a deploy must never run unverified code.
  validate:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  deploy-to-staging:
    needs: validate
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    # Force the runner container to execute commands directly inside the monorepo subfolder
    defaults:
      run:
        working-directory: dev/memli

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Same Node as verify.yml, so the build that deploys matches the one that was checked.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dev/memli/.nvmrc

      - name: Install Bun Toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # Pinning to exact local execution version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Order matters (#165): the schema before the code that reads it, and
      # memli-api-staging before the gate Worker, whose API binding needs it.
      # The token needs Workers Scripts Edit and D1 Edit.
      - name: Apply D1 Migrations (memli-staging)
        working-directory: dev/memli/apps/api
        run: bun run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy API Worker (memli-api-staging)
        working-directory: dev/memli/apps/api
        run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Compile and Deploy Application
        run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
