name: Continuous Deployment (Staging)

on:
  push:
    branches:
      - stage

jobs:
  deploy-to-staging:
    runs-on: ubuntu-latest
    
    # Force the runner container to execute commands directly inside the monorepo subfolder
    defaults:
      run:
        working-directory: dev/mnemno

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Bun Toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # Pinning to exact local execution version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile and Deploy Application
        run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
