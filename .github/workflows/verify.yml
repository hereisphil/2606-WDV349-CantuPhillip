name: CI Verification

on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  # Lets staging.yml / production.yml reuse this exact gate before deploying.
  workflow_call:
  # dependency-update.yml starts this on its own PR branch (GITHUB_TOKEN PRs
  # don't fire pull_request).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # This display name is the status-check context branch protection
    # requires. Do not rename it without updating branch protection first.
    name: validate
    runs-on: ubuntu-latest
    # Playwright Chromium + axe across dashboard previews needs headroom beyond the lint/build steps.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev/memli

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bun installs and runs scripts, but Vitest, tsc, ESLint, and Wrangler
      # execute on Node. Without this the runner's preinstalled Node decides.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dev/memli/.nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format Check
        run: bun run format:check

      # Both worker-configuration.d.ts files are committed output of
      # `wrangler types`. Regenerating must change nothing: editing
      # wrangler.jsonc or bumping wrangler without `bun run cf-typegen` fails
      # here. A diff, not `wrangler types --check`, which only compares hashes.
      - name: Worker Types Match Config
        run: |
          bun run cf-typegen
          git diff --exit-code -- worker-configuration.d.ts apps/api/worker-configuration.d.ts || {
            echo "::error::Worker types are stale. Run 'bun run cf-typegen' in dev/memli and commit both worker-configuration.d.ts files."
            exit 1
          }

      - name: Type Check
        run: bun run typecheck

      # The Worker entry (dev/memli/src/index.ts) is not a Turbo workspace
      # package, so `turbo typecheck` never sees it. Check it explicitly.
      - name: Type Check (Worker)
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # apps/api/src/db/schema.ts and the committed migrations must agree.
      # Regenerating must change nothing: a schema edit without
      # `bun run db:generate` writes a new migration here and fails the job.
      - name: Migrations Match Schema
        working-directory: dev/memli/apps/api
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle
          test -z "$(git ls-files --others --exclude-standard -- drizzle)" || {
            echo "::error::src/db/schema.ts changed without a migration. Run 'bun run db:generate' in apps/api and commit drizzle/."
            exit 1
          }

      - name: Unused Code (Knip)
        run: bun run knip

      - name: Build
        run: bun run build

      # Chromium only — axe covers rendered dashboard a11y that ESLint cannot.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: dev/memli/apps/web

      - name: Accessibility (axe)
        run: bun run test:a11y
        working-directory: dev/memli/apps/web
        env:
          CI: true

      # Bundles the Worker + wrangler config without deploying or needing
      # Cloudflare credentials (the web dist/ from Build must exist first).
      - name: Wrangler Dry Run (Staging)
        run: bunx wrangler deploy --dry-run --env staging
