<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Prototype artwork for the "casa" mnemonic: a house with a cash box on the roof. -->
  <rect width="400" height="300" fill="#dcebf7"/>
  <circle cx="330" cy="62" r="30" fill="#f5b942"/>
  <rect x="0" y="246" width="400" height="54" fill="#7fb069"/>
  <!-- House -->
  <rect x="110" y="140" width="180" height="112" fill="#f4efe6"/>
  <path d="M92 146 L200 66 L308 146 z" fill="#c0392b"/>
  <rect x="182" y="186" width="38" height="66" rx="3" fill="#1b2a4a"/>
  <circle cx="212" cy="222" r="3" fill="#f5b942"/>
  <rect x="128" y="168" width="38" height="34" fill="#9cc3e4" stroke="#1b2a4a" stroke-width="4"/>
  <rect x="236" y="168" width="38" height="34" fill="#9cc3e4" stroke="#1b2a4a" stroke-width="4"/>
  <!-- Cash box on the roof -->
  <rect x="166" y="28" width="68" height="46" rx="6" fill="#1b2a4a"/>
  <rect x="176" y="38" width="48" height="26" rx="3" fill="#f5b942"/>
  <text x="200" y="58" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b2a4a">$</text>
  <g fill="#3f8f4f">
    <rect x="148" y="12" width="26" height="14" rx="2" transform="rotate(-18 161 19)"/>
    <rect x="232" y="10" width="26" height="14" rx="2" transform="rotate(14 245 17)"/>
  </g>
</svg>
